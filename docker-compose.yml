# Compose stack: the Next.js site plus the UptimeKit worker.
#
# Why this lives here instead of in the Dockerfile: a Dockerfile produces one
# image. The site is built from ./Dockerfile, the worker is a published image,
# and only Compose can run both side by side with shared restart policy and
# volumes.
#
# Usage:
#   cp .env.example .env   # then fill in the gateway + uptimekit keys
#   docker compose up -d --build

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    ports:
      - "3000:3000"

  worker:
    image: ghcr.io/uptimekit/worker:latest
    restart: always
    env_file: .env
    volumes:
      - worker-events:/var/lib/uptimekit

volumes:
  worker-events: